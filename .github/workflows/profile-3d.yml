name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 BRT == 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Pedro-Lopes-Monteiro
      # The action always draws the radar and the language donut, and its
      # isometric angle is fixed at 30°. --angle is the ground tilt in degrees
      # (walls stay vertical). Candidates: 8, 14, 20.
      - name: Compact night-rainbow SVG
        run: python3 scripts/compact-profile-3d.py --angle 14
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
