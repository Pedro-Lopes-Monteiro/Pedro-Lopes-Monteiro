<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Terminal: whoami → Pedro Lopes Monteiro">
  <style>
    .bg{fill:#0d1117}.bar{fill:#161b22}
    text{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:18px}
    .p{fill:#7ee787}.c{fill:#e6edf3}.o{fill:#79c0ff}.d{fill:#8b949e}.h{fill:#ffa657;font-size:30px;font-weight:700}
    .l{opacity:0;animation:show .01s forwards}
    .l1{animation-delay:.3s}.l2{animation-delay:1.6s}.l3{animation-delay:2s}.l4{animation-delay:2.4s}.l5{animation-delay:3.6s}.l6{animation-delay:4s}.l7{animation-delay:4.4s}
    .t{clip-path:inset(0 100% 0 0)}
    .t1{animation:type 1.1s steps(14) .4s forwards}.t2{animation:type 1s steps(14) 2.6s forwards}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect class="bg" width="900" height="260" rx="12"/>
  <rect class="bar" width="900" height="34" rx="12"/><rect class="bar" y="20" width="900" height="14"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/>
