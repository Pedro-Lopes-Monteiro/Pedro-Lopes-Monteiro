  <g class="l l1"><text x="28" y="72"><tspan class="p">➜ ~</tspan> <tspan class="c t t1">whoami</tspan></text></g>
  <g class="l l2"><text x="28" y="112" class="h">Pedro Lopes Monteiro</text></g>
